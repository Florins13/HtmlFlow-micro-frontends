<div class="cart-container">
    {#for cartItem in cart.cartItems}
        <div class="cart-item">
            <div class="bike-box">
                <button id="deleteCartItem"
                        class="btn btn-delete"
                        value="{cartItem.getId()}">X</button>

                <h4>Model: {cartItem.getModel()}</h4>

                <img src="{cartItem.getImageSource()}" class="bike-img">

                <span>Stock: {cartItem.getQuantity()}</span>
                {!<span>Details: {cartItem.getDetails()}</span>!}
                {!<span>Electric: {cartItem.isElectric()}</span>!}
                <span>Price: {cartItem.getPrice()}€</span>

                <div class="quantity-group">
                    <button id="decreaseQuantity"
                            class="btn btn-qty"
                            value="{cartItem.getId()}">Decrease -</button>

                    <p>{cartItem.getQuantity()}</p>

                    <button id="increaseQuantity"
                            class="btn btn-qty"
                            value="{cartItem.getId()}">Increase +</button>
                </div>
            </div>
        </div>
    {/for}
</div>

<div class="cart-summary">
    <h3>Total: {cart.cartTotal} €</h3>
    <button id="triggerOrder"
            class="btn btn-checkout"
    {#if cart.cartIsEmpty()} disabled {/if}>
        Checkout
    </button>
</div>
